<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鹽分地帶天空之城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D canvas; paper-craft cards float at the corners like museum captions pinned on a diorama. */
:root{
  --paper:#fbf6ec;          /* handmade paper card */
  --paper-2:#f3ead8;
  --ink:#3b2f26;            /* brown-black ink */
  --ink-soft:#7a6553;
  --brick:#b5543a;          /* 臺南州廳 red brick */
  --salt:#e9eef0;           /* sea-salt white */
  --sea:#3f7f8c;            /* lagoon teal */
  --line:rgba(59,47,38,.16);
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","Noto Serif TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:#a9cfe0;color:var(--ink);font-family:var(--f-body);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 10px 30px -12px rgba(59,47,38,.45);
  background-image:radial-gradient(rgba(122,101,83,.06) 1px,transparent 1px);background-size:5px 5px}
.ui{position:fixed;z-index:5}

/* brand */
#brand{top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  padding:14px 18px 14px;max-width:320px}
#brand .org{font:500 11px/1 var(--f-body);letter-spacing:.18em;color:var(--brick);display:flex;align-items:center;gap:8px}
#brand .org::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--brick);transform:rotate(45deg)}
#brand h1{font:700 30px/1.15 var(--f-display);margin:8px 0 4px;letter-spacing:.04em;text-wrap:balance}
#brand p{margin:0;font-size:13px;line-height:1.6;color:var(--ink-soft)}

/* live panel */
#live{top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  width:260px;padding:14px 16px}
.live-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.14em;color:var(--ink-soft)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d9483b;margin-right:6px;
  box-shadow:0 0 0 0 rgba(217,72,59,.6);animation:pulse 2s infinite}
.dot.off{background:#a39380;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(217,72,59,0)}100%{box-shadow:0 0 0 0 rgba(217,72,59,0)}}
#clock{font:500 34px/1 var(--f-mono);margin:8px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#date{font-size:12px;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.kv span{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--ink-soft)}
.kv b{font:500 14px/1.4 var(--f-body);font-variant-numeric:tabular-nums}
.kv b small{font:400 11px var(--f-body);color:var(--ink-soft)}
.meter{display:inline-flex;gap:2px;vertical-align:middle;margin-right:2px}
.meter i{width:6px;height:12px;border-radius:2px;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--line)}
.meter i.on{background:#e0a33a;box-shadow:none}
.scrub{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.scrub label{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);letter-spacing:.06em}
.scrub input{width:100%;accent-color:var(--brick);margin:6px 0 2px}
.btn{font:500 12px var(--f-body);color:var(--ink);background:var(--paper-2);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;cursor:pointer}
.btn:hover{background:#ecdfc6}
.btn:focus-visible,.chip:focus-visible,#close:focus-visible{outline:2px solid var(--brick);outline-offset:2px}
#toggleLive{display:none}

/* nav */
#nav{left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:6px;padding:6px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:transparent;
  padding:7px 12px;border-radius:10px;cursor:pointer;color:var(--ink);text-align:left;font-family:var(--f-body)}
.chip small{font-size:10px;letter-spacing:.12em;color:var(--ink-soft)}
.chip span{font:700 15px var(--f-display);white-space:nowrap}
.chip:hover{background:var(--paper-2)}
.chip[aria-current="true"]{background:var(--ink);color:var(--paper)}
.chip[aria-current="true"] small{color:#d8c7ae}

/* floating labels */
#tags{position:fixed;inset:0;pointer-events:none;z-index:3}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  font:700 13px var(--f-display);background:var(--paper);color:var(--ink);border:1px solid var(--line);
  padding:4px 10px 4px 8px;border-radius:999px;white-space:nowrap;display:flex;gap:6px;align-items:center;
  box-shadow:0 4px 12px -4px rgba(59,47,38,.4);transition:opacity .3s}
.tag i{font:500 10px var(--f-mono);font-style:normal;background:var(--brick);color:#fff;border-radius:999px;padding:1px 6px}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;width:1px;height:6px;background:var(--ink-soft)}

/* detail panel */
#panel{right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));
  bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));
  display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 40px));transition:transform .55s cubic-bezier(.2,.8,.2,1);z-index:6}
#panel.open{transform:none}
#panel header{padding:18px 20px 12px;border-bottom:1px dashed var(--line);position:relative}
#panel .place{font:500 11px var(--f-mono);letter-spacing:.12em;color:var(--brick)}
#panel h2{font:700 26px/1.2 var(--f-display);margin:6px 0 2px;text-wrap:balance}
#panel .sub{font-size:13px;color:var(--ink-soft)}
#close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:var(--paper-2);cursor:pointer;font-size:16px;color:var(--ink)}
#panel .body{padding:16px 20px 20px;overflow-y:auto;min-width:0}
#panel .body p{font-size:14.5px;line-height:1.85;margin:0 0 12px;max-width:62ch}
.nowbox{display:flex;gap:10px;align-items:flex-start;background:var(--paper-2);border-radius:10px;padding:10px 12px;margin:0 0 14px}
.nowbox .lbl{flex:none;font:500 10px var(--f-mono);letter-spacing:.1em;background:var(--sea);color:#fff;border-radius:4px;padding:3px 6px;margin-top:2px}
.nowbox div{font-size:13.5px;line-height:1.6}
.h3{font:700 12px var(--f-body);letter-spacing:.16em;color:var(--ink-soft);margin:16px 0 8px}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people span{font:400 13px var(--f-display);border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:#fff8}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.timeline li{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:13.5px;line-height:1.6}
.timeline b{font:500 13px var(--f-mono);color:var(--brick);font-variant-numeric:tabular-nums}

.works{display:grid;gap:10px}
.wk{background:#fffdf7;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.wk-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.wk h4{margin:0;font:700 16px/1.4 var(--f-display);text-wrap:balance}
.wk-badge{flex:none;font:500 10.5px var(--f-body);letter-spacing:.04em;color:#8a5a12;background:#f6e3b8;border:1px dashed #c99a3e;border-radius:4px;padding:2px 6px;white-space:nowrap}
.wk-badge.ok{color:#fff;background:var(--sea);border:1px solid var(--sea)}
.wk-meta{font:400 12px var(--f-body);color:var(--ink-soft);margin:2px 0 6px}
#panel .body .wk p{font-size:13.5px;line-height:1.75;margin:0}
.wk-src{margin-top:6px;font-size:11px;color:var(--ink-soft);overflow-wrap:anywhere}
.wk-src a{color:var(--sea)}
#hint{left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));
  font-size:12px;color:#fff;background:rgba(59,47,38,.55);padding:6px 12px;border-radius:999px;transition:opacity .6s;pointer-events:none}
#loader{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:#a9cfe0;color:var(--ink);
  font:700 20px var(--f-display);transition:opacity .8s}
#loader.done{opacity:0;pointer-events:none}

/* guide 琵琵 */
#guide{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));
  width:min(380px,calc(100vw - 32px));padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.g-head{display:flex;align-items:center;gap:10px}
.g-ava{flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--line)}
.g-ava.talk{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px) rotate(-4deg)}}
.g-who{flex:1;min-width:0;display:flex;flex-direction:column}
.g-who b{font:700 17px var(--f-display)}
.g-who span{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-mini{padding:4px 10px;font-size:11.5px}
.g-mini[aria-pressed="false"]{color:var(--ink-soft);text-decoration:line-through}
.g-body{display:flex;flex-direction:column;gap:10px}
#guide.min .g-body{display:none}
.g-q{font-size:12.5px;color:var(--ink-soft);border-left:3px solid var(--sea);padding-left:8px}
#gText{margin:0;font:400 15.5px/1.75 var(--f-display);min-height:3.5em;max-height:9.5em;overflow-y:auto;
  background:#fff9;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;white-space:pre-wrap}
.g-prog{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft)}
.g-prog i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.g-prog i.on{background:var(--brick)}
.g-prog i.done{background:#d8a08f}
.g-ctrl{display:flex;flex-wrap:wrap;gap:6px}
#gTourCtl{display:flex;flex-wrap:wrap;gap:6px}
#gTourCtl[hidden]{display:none}
.btn.primary{background:var(--brick);color:#fff;border-color:var(--brick)}
.btn.primary:hover{background:#9c4530}
.btn:disabled{opacity:.5;cursor:default}
.g-ask{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px dashed var(--line)}
.g-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.g-chips::-webkit-scrollbar{display:none}
.g-chips button{flex:none;font:400 12px var(--f-body);border:1px dashed var(--ink-soft);background:transparent;color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.g-chips button:hover{background:var(--paper-2)}
.g-row{display:flex;gap:6px}
.g-row input{flex:1;min-width:0;font:400 14px var(--f-body);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.g-row input:focus-visible{outline:2px solid var(--sea);outline-offset:1px}
.g-note{font-size:10.5px;color:var(--ink-soft)}

@media (max-width:760px){
  #guide{top:calc(76px + env(safe-area-inset-top,0px));bottom:auto;width:auto;right:max(16px,env(safe-area-inset-right,0px));padding:10px 12px}
  #gText{font-size:14.5px;max-height:6.5em}
  #hint{display:none}
  body.panel-open #guide .g-ask,body.panel-open #guide .g-ctrl,body.panel-open #guide .g-prog{display:none}
  body.touring #live{display:none}
}
@media (max-width:760px){
  #brand{max-width:calc(100vw - 32px);right:max(16px,env(safe-area-inset-right,0px));padding:10px 14px}
  #brand h1{font-size:22px;margin:6px 0 2px}
  #brand p{display:none}
  #live{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;left:max(16px,env(safe-area-inset-left,0px));padding:10px 14px}
  #live.collapsed .grid,#live.collapsed .scrub{display:none}
  #clock{font-size:22px;margin:4px 0 0}
  #toggleLive{display:inline-block}
  #panel{top:auto;bottom:0;right:0;left:0;width:auto;max-height:68vh;border-radius:18px 18px 0 0;
    transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  #hint{bottom:auto;top:calc(90px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}.dot{animation:none}}
</style>
</head>
<body>

<div id="loader">雲海正在升起……</div>
<canvas id="stage" aria-label="鹽分地帶浮空群島 3D 場景"></canvas>
<div id="tags"></div>

<section id="brand" class="ui card">
  <div class="org">國立臺灣文學館 · 線上特展</div>
  <h1>臺南鹽分地帶文學</h1>
  <p>漂在雲海上的六座小島，每一座都是北門郡沿海的一段文學記憶。拖曳旋轉、滾輪縮放，點擊島嶼登島閱讀。</p>
</section>

<section id="live" class="ui card collapsed" aria-live="polite">
  <div class="live-h"><span><i class="dot" id="liveDot"></i><span id="liveLabel">即時 · 北門天空</span></span>
    <button class="btn" id="toggleLive" aria-expanded="false">展開</button></div>
  <div id="clock">--:--</div>
  <div id="date">—</div>
  <div class="grid">
    <div class="kv"><span>天色</span><b id="phase">—</b></div>
    <div class="kv"><span>太陽高度</span><b id="alt">—</b></div>
    <div class="kv"><span>日出 / 日落</span><b id="rise">—</b></div>
    <div class="kv"><span>月相</span><b id="moon">—</b></div>
    <div class="kv"><span>節氣</span><b id="term">—</b></div>
    <div class="kv"><span>曬鹽日照</span><b id="saltIdx">—</b></div>
  </div>
  <div class="scrub">
    <label for="scrub"><span>時光捲軸</span><span id="offsetLbl">現在</span></label>
    <input type="range" id="scrub" min="-24" max="24" step="0.25" value="0">
    <button class="btn" id="nowBtn">回到現在</button>
  </div>
</section>

<nav id="nav" class="ui card" aria-label="島嶼導覽"></nav>
<div id="hint" class="ui">拖曳旋轉 · 點擊島嶼登島</div>

<section id="guide" class="ui card" aria-label="導覽員琵琵">
  <div class="g-head">
    <div class="g-ava" id="gAva" aria-hidden="true"><svg viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="20" r="20" fill="#3f7f8c"/><ellipse cx="15" cy="24" rx="10" ry="9" fill="#fdfcf8"/><ellipse cx="19" cy="24" rx="5.5" ry="4.8" fill="#232220"/><rect x="21" y="23" width="12" height="2.6" rx="1.3" fill="#232220"/><circle cx="34" cy="24.3" r="3.2" fill="#232220"/><circle cx="18" cy="22" r="1.3" fill="#fdfcf8"/><path d="M5 16 L17 9 L29 16 Z" fill="#d9b56a"/><rect x="9" y="15" width="16" height="2" fill="#b5543a"/></svg></div>
    <div class="g-who"><b>琵琵</b><span id="gStatus">黑面琵鷺 · 鹽分地帶導覽員</span></div>
    <button class="btn g-mini" id="gVoice" aria-pressed="true" hidden>朗讀</button>
    <button class="btn g-mini" id="gMin" aria-expanded="true">收起</button>
  </div>
  <div class="g-body">
    <div class="g-q" id="gQ" hidden></div>
    <p id="gText" aria-live="polite">嗨，我是琵琵，一隻從七股潟湖飛來的黑面琵鷺。按「開始導覽」，我帶你一路飛過六座島。</p>
    <div class="g-prog" id="gProg" hidden></div>
    <div class="g-ctrl">
      <button class="btn primary" id="gStart">開始導覽</button>
      <span id="gTourCtl" hidden>
        <button class="btn" id="gPrev">上一站</button>
        <button class="btn" id="gPause">暫停</button>
        <button class="btn" id="gNext">下一站</button>
        <button class="btn" id="gEnd">結束導覽</button>
      </span>
    </div>
    <form class="g-ask" id="gAsk" hidden>
      <div class="g-chips" id="gChips"></div>
      <div class="g-row">
        <input id="gInput" aria-label="向琵琵提問" type="text" maxlength="200" placeholder="想問琵琵什麼？例如：誰是北門七子？" autocomplete="off">
        <button class="btn primary" id="gSend" type="submit">問琵琵</button>
      </div>
      <div class="g-note">回答由 Claude 即時產生，可能有誤，史實請以臺灣文學館資料為準。</div>
    </form>
  </div>
</section>

<aside id="panel" class="ui card" aria-hidden="true">
  <header>
    <div class="place" id="pPlace"></div>
    <h2 id="pTitle"></h2>
    <div class="sub" id="pSub"></div>
    <button id="close" aria-label="關閉">✕</button>
  </header>
  <div class="body" id="pBody"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const LAT=23.27, LON=120.13; // 北門
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- astronomy (real-time) ---------------- */
const rad=Math.PI/180;
function sunAt(ms){
  const d=(ms-946728000000)/86400000;
  const g=(357.529+0.98560028*d)*rad, q=280.459+0.98564736*d;
  let L=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))%360; if(L<0)L+=360;
  const e=(23.439-0.00000036*d)*rad, Lr=L*rad;
  const ra=Math.atan2(Math.cos(e)*Math.sin(Lr),Math.cos(Lr));
  const dec=Math.asin(Math.sin(e)*Math.sin(Lr));
  let gmst=(18.697374558+24.06570982441908*d)%24;
  const ha=((gmst*15+LON)*rad)-ra;
  const la=LAT*rad;
  const alt=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(ha));
  const az=Math.atan2(-Math.sin(ha),Math.tan(dec)*Math.cos(la)-Math.sin(la)*Math.cos(ha));
  return {alt:alt/rad, az:az/rad, lon:L};
}
const TERMS=["春分","清明","穀雨","立夏","小滿","芒種","夏至","小暑","大暑","立秋","處暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至","小寒","大寒","立春","雨水","驚蟄"];
function twParts(ms){ // Taiwan UTC+8
  const t=new Date(ms+8*3600000);
  return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate(),h:t.getUTCHours(),mi:t.getUTCMinutes(),s:t.getUTCSeconds(),wd:t.getUTCDay()};
}
const pad=n=>String(n).padStart(2,"0");
function riseSet(ms){
  const p=twParts(ms); const start=Date.UTC(p.y,p.m-1,p.d)-8*3600000;
  let rise=null,set=null,prev=sunAt(start).alt;
  for(let t=start+120000;t<=start+86400000;t+=120000){
    const a=sunAt(t).alt;
    if(prev<-0.833&&a>=-0.833&&!rise)rise=t;
    if(prev>=-0.833&&a<-0.833)set=t;
    prev=a;
  }
  const f=x=>{if(!x)return"--:--";const q=twParts(x);return pad(q.h)+":"+pad(q.mi)};
  return f(rise)+" / "+f(set);
}
function nextTerm(ms){
  const idx=Math.floor(sunAt(ms).lon/15);
  for(let t=ms;t<ms+20*86400000;t+=3600000){
    const i=Math.floor(sunAt(t).lon/15);

/* rope bridges from museum to each island */
const ropeM=new THREE.MeshStandardMaterial({color:0x8a6a48,roughness:1});
const plankM=M(0xc49a6c);
for(let i=1;i<ISLES.length;i++){
  const a=new THREE.Vector3(0,0.75,0), b=new THREE.Vector3(...ISLES[i].pos).add(new THREE.Vector3(0,0.75,0));
  const dir=b.clone().sub(a).setY(0).normalize();
  const A=a.clone().add(dir.clone().multiplyScalar(ISLES[0].r*0.95));
  const B=b.clone().sub(dir.clone().multiplyScalar(ISLES[i].r*0.92));
  const mid=A.clone().lerp(B,0.5); mid.y-=1.6;
  const curve=new THREE.QuadraticBezierCurve3(A,mid,B);
  const side=new THREE.Vector3(-dir.z,0,dir.x).multiplyScalar(0.28);
  for(const s of [1,-1]){const c2=new THREE.QuadraticBezierCurve3(A.clone().add(side.clone().multiplyScalar(s)).setY(A.y+0.4),mid.clone().add(side.clone().multiplyScalar(s)).setY(mid.y+0.4),B.clone().add(side.clone().multiplyScalar(s)).setY(B.y+0.4));
    scene.add(mesh(new THREE.TubeGeometry(c2,24,0.025,4),ropeM,false,false));}
  const n=Math.floor(A.distanceTo(B)/0.42);
  for(let k=1;k<n;k++){const p=curve.getPoint(k/n),tg=curve.getTangent(k/n);
    const pl=mesh(new THREE.BoxGeometry(0.62,0.04,0.2),plankM,true,false);pl.position.copy(p);
    pl.lookAt(p.clone().add(tg));pl.rotateY(Math.PI/2);pl.rotation.order="YXZ";
    const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),tg.clone().normalize());pl.quaternion.copy(q);
    scene.add(pl);}
}

/* ---------------- sky & lighting from real time ---------------- */
const C=h=>new THREE.Color(h);
const KEY=[ // sun altitude → [top, mid(horizon), bottom, sunColor, intensity, hemi]
  [-18,C(0x0d1630),C(0x1d2a4d),C(0x2a3557),C(0x8fa6d9),0.25,0.28],
  [-6, C(0x26355f),C(0x7a5d7f),C(0x4a4f72),C(0x9fb0e0),0.3,0.32],
  [0,  C(0x5a79a8),C(0xf2a776),C(0xe8b8a0),C(0xffb27a),0.75,0.45],
  [8,  C(0x77a9d1),C(0xf6d1a6),C(0xf1dfcf),C(0xffd2a0),1.2,0.55],
  [25, C(0x6fb0dc),C(0xcfe6f0),C(0xeaf3f5),C(0xfff3dc),1.55,0.62],
  [70, C(0x5aa6dc),C(0xc4e2f2),C(0xeaf4f8),C(0xffffff),1.7,0.66]];
function skyFor(alt){
  let i=0;while(i<KEY.length-1&&alt>KEY[i+1][0])i++;
  const a=KEY[i],b=KEY[Math.min(i+1,KEY.length-1)];
  const t=b===a?0:Math.min(1,Math.max(0,(alt-a[0])/(b[0]-a[0])));
  const L=(x,y)=>x.clone().lerp(y,t);
  return {top:L(a[1],b[1]),mid:L(a[2],b[2]),bot:L(a[3],b[3]),sun:L(a[4],b[4]),I:a[5]+(b[5]-a[5])*t,H:a[6]+(b[6]-a[6])*t};
}
let offsetH=0;
const $=id=>document.getElementById(id);
function phaseName(a){return a< -12?"深夜":a< -6?"夜幕":a<0?"暮光":a<8?(isMorning()?"晨曦":"夕照"):a<30?"晴空":"正午豔陽"}
let lastSun={alt:0,az:0};
function isMorning(){return twParts(now()).h<12}
const now=()=>Date.now()+offsetH*3600000;
let lastRiseDay="", riseCache="", termCache=null;

function applyTime(){
  const t=now(), s=sunAt(t); lastSun=s;
  const k=skyFor(s.alt);
  skyU.top.value.copy(k.top);skyU.mid.value.copy(k.mid);skyU.bot.value.copy(k.bot);
  scene.fog.color.copy(k.mid);
  document.body.style.background="#"+k.mid.getHexString();
  // sun direction (azimuth from north, clockwise) → scene: north = -z
  const alt=s.alt*rad, az=s.az*rad;
  const dir=new THREE.Vector3(Math.sin(az)*Math.cos(alt),Math.sin(alt),-Math.cos(az)*Math.cos(alt));
  sunDisc.position.copy(dir.clone().multiplyScalar(150));sunDisc.visible=s.alt>-4;
  const mdir=dir.clone().multiplyScalar(-1);mdir.y=Math.abs(mdir.y)*0.8+0.25;mdir.normalize();
  moonDisc.position.copy(mdir.clone().multiplyScalar(150));moonDisc.visible=s.alt<2;
  const night=s.alt<-2;
  const L=night?mdir:dir.clone().setY(Math.max(dir.y,0.12)).normalize();
  sun.position.copy(L.clone().multiplyScalar(60));sun.color.copy(k.sun);sun.intensity=k.I;
  hemi.intensity=k.H;hemi.color.copy(k.top.clone().lerp(C(0xffffff),0.5));
  cloudM.color.copy(C(0xffffff).lerp(k.mid,night?0.65:0.18));

function makeGuide(){
  const g=new THREE.Group();
  const white=M(0xfdfcf8,{roughness:0.85}),black=M(0x232220),gold=M(0xe2bd5c),hatM=M(0xd9b56a),band=M(0xb5543a);
  const body=mesh(new THREE.SphereGeometry(0.5,14,10),white);body.scale.set(1.35,1,1);body.position.y=0.95;g.add(body);
  const breast=mesh(new THREE.SphereGeometry(0.3,10,8),gold);breast.scale.set(0.6,0.7,0.9);breast.position.set(0.48,1.08,0);g.add(breast);
  const tail=mesh(new THREE.ConeGeometry(0.22,0.5,6),white);tail.rotation.z=Math.PI/2+0.3;tail.position.set(-0.75,1.05,0);g.add(tail);
  const neck=mesh(new THREE.CylinderGeometry(0.11,0.15,0.7,8),white);neck.position.set(0.45,1.45,0);neck.rotation.z=-0.35;g.add(neck);
  const head=new THREE.Group();head.position.set(0.62,1.85,0);g.add(head);
  head.add(mesh(new THREE.SphereGeometry(0.22,12,10),white));
  const mask=mesh(new THREE.SphereGeometry(0.17,10,8),black);mask.scale.set(1,0.9,1.06);mask.position.set(0.1,-0.02,0);head.add(mask);
  for(const s of [1,-1]){const ew=mesh(new THREE.SphereGeometry(0.045,8,6),M(0xffffff),false,false);ew.position.set(0.15,0.05,s*0.15);head.add(ew);
    const ep=mesh(new THREE.SphereGeometry(0.025,6,4),black,false,false);ep.position.set(0.18,0.05,s*0.17);head.add(ep);}
  const bill=new THREE.Group();bill.position.set(0.22,-0.06,0);head.add(bill);
  const shaft=mesh(new THREE.BoxGeometry(0.55,0.05,0.09),black);shaft.position.x=0.27;bill.add(shaft);
  const spoon=mesh(new THREE.CylinderGeometry(0.12,0.12,0.05,14),black);spoon.position.x=0.58;spoon.scale.z=0.95;bill.add(spoon);
  for(let i=0;i<4;i++){const c=mesh(new THREE.ConeGeometry(0.05,0.32,5),gold);c.position.set(-0.2,0.06+i*0.03,(i-1.5)*0.05);c.rotation.z=1.25+i*0.08;head.add(c);}
  const hat=mesh(new THREE.ConeGeometry(0.38,0.2,18),hatM);hat.position.y=0.27;head.add(hat);
  const hb=mesh(new THREE.CylinderGeometry(0.19,0.21,0.05,14),band);hb.position.y=0.19;head.add(hb);
  const wings=[];
  for(const s of [1,-1]){const piv=new THREE.Group();piv.position.set(-0.05,1.08,s*0.4);
    const w=mesh(new THREE.SphereGeometry(0.42,10,8),white);w.scale.set(1.2,0.16,0.62);w.position.z=s*0.26;piv.add(w);
    const tip=mesh(new THREE.SphereGeometry(0.16,8,6),black);tip.scale.set(1.4,0.2,0.5);tip.position.set(-0.4,0,s*0.42);piv.add(tip);
    g.add(piv);wings.push(piv);}
  for(const s of [1,-1]){const lg=mesh(new THREE.CylinderGeometry(0.03,0.03,0.6,5),black);lg.position.set(0.05,0.3,s*0.13);g.add(lg);
    const ft=mesh(new THREE.BoxGeometry(0.22,0.03,0.12),black);ft.position.set(0.12,0.02,s*0.13);g.add(ft);}
  const bag=mesh(new THREE.BoxGeometry(0.26,0.22,0.08),M(0xb5543a));bag.position.set(0.05,0.82,0.52);bag.rotation.x=-0.15;g.add(bag);
  const pg=mesh(new THREE.BoxGeometry(0.18,0.06,0.02),M(0xfbf6ec));pg.position.set(0.05,0.95,0.55);g.add(pg);
  g.scale.setScalar(0.85);
  g.userData={head,wings,bill};
  return g;
}
const guide=makeGuide();scene.add(guide);
const G={isle:0,offset:new THREE.Vector3(),from:new THREE.Vector3(),t:1,dur:1.8,talking:false,lastDir:new THREE.Vector3(1,0,0)};
function spotOffset(i){
  const d=ISLES[i],p=islandObjs[i].position;
  const out=new THREE.Vector3(p.x,0,p.z);if(out.lengthSq()<1)out.set(1,0,1.2);out.normalize();
  const side=new THREE.Vector3(-out.z,0,out.x);
  return out.multiplyScalar(d.r*0.62).add(side.multiplyScalar(d.r*0.42)).setY(0.72);
}
function flyGuide(i){G.from.copy(guide.position);G.isle=i;G.offset.copy(spotOffset(i));G.t=0;G.dur=reduce?0.01:1.9;}
G.offset.copy(spotOffset(0));guide.position.copy(islandObjs[0].position).add(G.offset);
const _tgt=new THREE.Vector3(),_dir=new THREE.Vector3();
function faceToward(dx,dz,k){const a=Math.atan2(-dz,dx);let d=a-guide.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));guide.rotation.y+=d*k;}
function updateGuide(dt,T){
  const u=guide.userData;
  _tgt.copy(islandObjs[G.isle].position).add(G.offset);
  if(G.t<1){
    G.t=Math.min(1,G.t+dt/G.dur);const k=G.t<.5?2*G.t*G.t:1-Math.pow(-2*G.t+2,2)/2;
    guide.position.lerpVectors(G.from,_tgt,k);guide.position.y+=Math.sin(Math.PI*k)*Math.min(5,G.from.distanceTo(_tgt)*0.25);
    _dir.subVectors(_tgt,G.from);if(_dir.lengthSq()>0.01)faceToward(_dir.x,_dir.z,0.15);
    const f=Math.sin(T*16)*0.9;u.wings[0].rotation.x=-f;u.wings[1].rotation.x=f;
    guide.rotation.z=Math.sin(Math.PI*k)*0.25;
  }else{
    guide.position.copy(_tgt);guide.position.y+=reduce?0:Math.abs(Math.sin(T*2.2))*0.05;
    faceToward(camera.position.x-guide.position.x,camera.position.z-guide.position.z,0.08);
    const w=reduce?0:Math.sin(T*1.4)*0.06;u.wings[0].rotation.x=-w;u.wings[1].rotation.x=w;guide.rotation.z*=0.9;
  }
  u.head.rotation.z=reduce?0:(G.talking?Math.sin(T*13)*0.09:Math.sin(T*1.3)*0.05);
  u.bill.rotation.z=G.talking&&!reduce?Math.max(0,Math.sin(T*18))*0.12:0;
}

function speak(text){
  if(!canSpeak||!voiceOn)return null;

    try{speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text.replace(/[「」〈〉]/g,""));
      u.lang=zhVoice?zhVoice.lang:"zh-TW";if(zhVoice)u.voice=zhVoice;u.rate=1.02;u.pitch=1.2;
      const t=setTimeout(res,text.length*380+2500);

  const chars=[...text];let i=0;gText.textContent="";talking(true);
  const spoken=voice?speak(text):null;
  return new Promise(res=>{
    const finishTyping=()=>{gText.textContent=text;
      const after=spoken||new Promise(r=>setTimeout(r,Math.max(1800,chars.length*95)));
      after.then(()=>{if(id===sayId){talking(false);res(true);}else res(false);});};
    if(reduce){finishTyping();return;}
    typer=setInterval(()=>{if(id!==sayId){clearInterval(typer);res(false);return;}

async function runTour(from=0){
  const id=++tourId;touring=true;paused=false;$("gQ").hidden=true;setTourUI(true);
  for(let s=from;s<TOUR.length;s++){
    tourStop=s;renderProg();const st=TOUR[s];

      document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-current","false"));}
    else select(st.isle,{fromTour:true,panel:!mobile()});
    if(guide.position.distanceTo(islandObjs[st.isle].position.clone().add(spotOffset(st.isle)))>1)flyGuide(st.isle);
    await sleep(reduce?50:1500);if(id!==tourId)return;
    const featured=s<TOUR.length-1?(WORKS[ISLES[st.isle].id]||[]).find(w=>w.line):null;
    for(const l of featured?[...st.lines,featured.line]:st.lines){
      if(!await waitPaused(id))return;

$("gPrev").addEventListener("click",()=>{stopTalking();runTour(Math.max(0,tourStop-1));});
$("gEnd").addEventListener("click",()=>endTour(false));
$("gPause").addEventListener("click",e=>{
  paused=!paused;e.target.textContent=paused?"繼續":"暫停";$("gStatus").textContent=paused?"導覽暫停中":"導覽進行中";
  if(canSpeak)try{paused?speechSynthesis.pause():speechSynthesis.resume()}catch(_){}
});
$("gVoice").addEventListener("click",()=>{voiceOn=!voiceOn;setVoiceBtn();if(!voiceOn)hush();
  try{localStorage.setItem("saltland-voice",voiceOn?"1":"0")}catch(e){}});
$("gMin").addEventListener("click",e=>{const m=$("guide").classList.toggle("min");e.target.textContent=m?"展開":"收起";e.target.setAttribute("aria-expanded",String(!m));});

/* single-island visit when the viewer clicks on their own */
function guideVisit(i){
  flyGuide(i);$("gQ").hidden=true;
  const first=lineText(TOUR.find(s=>s.isle===i&&s!==TOUR[TOUR.length-1]).lines[0]);
  const tail=sampleFn?(mobile()?"想知道更多，往下看介紹卡，或直接問我。":"想知道更多，看右邊的介紹卡，或直接問我。"):"更多內容在介紹卡裡。";
  setTimeout(()=>{if(!touring&&current===i)say(first+tail);},reduce?0:900);
}
const POKES=["咕咕！要我帶你逛一圈嗎？按「開始導覽」就出發。","我的嘴巴像湯匙，在潟湖裡左右掃，就能撈到小魚小蝦。","戴斗笠是跟北門的鹽工學的，曬鹽的日頭很大喔。"];
let pokeN=0;function guidePoked(){if(touring)return;say(POKES[pokeN++%POKES.length]);}

/* ---- free questions (asks Claude on the viewer's account) ---- */
let sampleFn=null,turns=[],askCtl=null,asking=false;
const SUGGEST=["「鹽分地帶」這個名字怎麼來的？","吳新榮是什麼樣的人？","北門七子是哪幾位？","鹽在這些作品裡象徵什麼？"];
$("gChips").innerHTML=SUGGEST.map(q=>`<button type="button">${q}</button>`).join("");
$("gChips").addEventListener("click",e=>{if(e.target.tagName==="BUTTON"&&!asking){$("gInput").value=e.target.textContent;ask();}});
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("sample").then(s=>{if(s){sampleFn=s;$("gAsk").hidden=false;}}).catch(()=>{});
}
function exhibitText(){
  return ISLES.map(d=>`【${d.title}｜${d.place}】${d.text.join("")} 相關：${d.people.join("、")}。年表：${d.timeline.map(t=>t.join(" ")).join("；")}。`+
    (WORKS[d.id]||[]).map(w=>` 代表作品${w.title}（${w.author}，${w.year}${w.review?"，館方審訂":"，草稿待審訂"}）：${w.card}`).join("")).join("\n");
}
function rules(){
  const p=twParts(now());
  return `你是「琵琵」，一隻戴斗笠的黑面琵鷺，是國立臺灣文學館線上特展「臺南鹽分地帶文學」3D 浮空群島網站的導覽員。
回答規則：
- 使用臺灣慣用的繁體中文，語氣親切、像現場導覽員，偶爾可自稱琵琵。
- 每次回答 2 到 4 句，不超過 140 字。純文字，不用 Markdown、條列、標題或表情符號。
- 只談鹽分地帶文學、相關作家與作品、日治北門郡沿海（北門、將軍、七股、學甲、西港、佳里）的歷史與地景、黑面琵鷺與鹽田、臺灣文學館與本網站。其他話題請溫和地帶回展覽。
- 史實務必正確。下方展覽內容可直接採用；展覽沒寫到而你不確定的人名、年份或細節，要坦白說不確定，建議查閱臺灣文學館的資料，不可編造。
- 不要大段引用受著作權保護的詩文，用自己的話介紹即可。
- 開放時間、票價、活動等營運資訊，一律請訪客以臺灣文學館官網公告為準。
展覽內容：
${exhibitText()}
現在是臺灣時間 ${p.y}/${p.m}/${p.d} ${pad(p.h)}:${pad(p.mi)}，訪客正在看「${current>=0?ISLES[current].title:"群島全景"}」。`;
}
const ERR={
  rate_limited:"問題有點多，琵琵先喘口氣，等一下再問我好嗎？",
  session_expired:"登入狀態過期了，請重新登入 Claude 後再問。",
  refused:"這個問題琵琵沒辦法回答，換個問法試試看？",
  empty_completion:"琵琵一時想不出來，換個問法試試看？",
  prompt_too_large:"對話太長了，琵琵忘了開頭。請重新整理頁面再問。"
};
const HIDE=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
async function ask(){
  if(asking){askCtl?.abort();return;}
  const q=$("gInput").value.trim();if(!q||!sampleFn)return;
  if(touring&&!paused)$("gPause").click();
  stopTalking();asking=true;askCtl=new AbortController();
  $("gSend").textContent="停止";$("gInput").value="";
  $("gQ").hidden=false;$("gQ").textContent="你問："+q;
  $("guide").classList.remove("min");gText.textContent="琵琵想一下……";talking(true);
  const msgs=[{role:"user",content:rules()},...turns.slice(-6),{role:"user",content:q}];
  try{
    const {text}=await sampleFn(msgs,{modelTier:"quick",cache:false,signal:askCtl.signal,onText:({text})=>{gText.textContent=text;}});
    turns.push({role:"user",content:q},{role:"assistant",content:text});
    gText.textContent=text;const sp=speak(text);if(sp)await sp;
  }catch(e){
    const code=e&&e.code;
    if(code==="cancelled"){gText.textContent=(e.text||"")+(e.text?"\n":"")+"（已停止）";}
    else if(HIDE.includes(code)){gText.textContent="這個頁面目前無法向琵琵提問，不過導覽還是可以照常使用。";$("gAsk").hidden=true;sampleFn=null;}
    else if(code==="refused"){gText.textContent=ERR.refused;}
    else{gText.textContent=(e&&e.text?e.text+"\n（回答中斷）":"")||(ERR[code]||"訊號被雲層擋住了，請再問一次。");}
  }finally{asking=false;talking(false);$("gSend").textContent="問琵琵";}
}
$("gAsk").addEventListener("submit",e=>{e.preventDefault();ask();});

/* ---------------- loop ---------------- */
const clock=new THREE.Clock();const v=new THREE.Vector3();let acc=0;
function tick(){
  const dt=Math.min(clock.getDelta(),0.05),T=clock.elapsedTime;
  if(fly.active){fly.t+=dt/fly.dur;const k=fly.t>=1?1:1-Math.pow(1-fly.t,3);
    camera.position.lerpVectors(fly.fromP,fly.toP,k);controls.target.lerpVectors(fly.fromT,fly.toT,k);if(fly.t>=1)fly.active=false;}
  controls.update();
  if(!reduce){
    islandObjs.forEach(g=>{g.position.y=g.userData.baseY+Math.sin(T*0.6+g.userData.phase)*0.35;g.rotation.y=Math.sin(T*0.15+g.userData.phase)*0.03;});
    sea.rotation.y=T*0.005;
    drifters.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>50)c.position.x=-50;});
    birds.forEach(b=>{const u=b.userData,a=T*u.s+u.p;b.position.set(Math.cos(a)*u.r,u.h+Math.sin(T+u.p)*0.6,Math.sin(a)*u.r);
      b.rotation.y=-a;const f=Math.sin(T*8+u.p)*0.6;u.pl.rotation.x=f;u.pr.rotation.x=-f;});
    animated.forEach(a=>{
      if(a.type==="spin")a.o.rotation.z+=dt*1.6;
      else if(a.type==="worker"){a.o.position.x=a.b.x+Math.sin(T*0.5)*0.6;a.o.rotation.y=Math.cos(T*0.5)>0?0:Math.PI;}
      else if(a.type==="bird"){a.o.rotation.x=Math.max(0,Math.sin(T*1.3+a.seed))*0.35;}
      else if(a.type==="sway"){a.o.rotation.z=Math.sin(T*1.6+a.seed)*0.15;}
      else if(a.type==="page"){const c=(T*0.35)%2;a.o.rotation.z=c<1?Math.PI*(0.5-0.5*Math.cos(Math.PI*c)):Math.PI;a.o.visible=c<1.05;}
    });
  }
  sun.target.position.copy(controls.target);
  updateGuide(dt,T);
  // labels
  islandObjs.forEach((g,i)=>{v.copy(g.position);v.y+=ISLES[i].id==="museum"?5.4:3.4;v.project(camera);
    const el=tagEls[i];const vis=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1;
    el.style.opacity=vis?(current>=0&&current!==i?0.45:1):0;
    el.style.left=((v.x+1)/2*innerWidth)+"px";el.style.top=((1-v.y)/2*innerHeight)+"px";});
  acc+=dt;if(acc>1){acc=0;applyTime();}
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
applyTime();
requestAnimationFrame(tick);
setTimeout(()=>$("loader").classList.add("done"),300);
})();
</script>
